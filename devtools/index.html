<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pokédex · Reference desk</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1016;color:#e7edf4;font:15px system-ui}button,input,select{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer;background:#1c2938;color:inherit;border:1px solid #3b4b60;border-radius:8px;padding:10px}button:hover{border-color:#9bdacb}header{padding:24px 30px;border-bottom:1px solid #263445;display:flex;align-items:center;gap:20px}h1{font-size:21px;margin:0}small,.muted{color:#9eafc2}#status{margin-left:auto;color:#9bdacb}aside{width:250px;position:fixed;top:89px;bottom:0;padding:20px;border-right:1px solid #263445;display:flex;flex-direction:column;gap:12px}input,select{background:#121c28;color:inherit;border:1px solid #3b4b60;border-radius:7px;padding:10px;width:100%}#list{overflow:auto;display:grid;gap:5px}#list button{text-align:left;border-color:transparent;background:transparent}#list button.active{background:#23463f;color:#bdfbe6}main{margin-left:250px;padding:28px;max-width:1800px}.top{display:flex;gap:18px;align-items:center;flex-wrap:wrap}h2{font-size:34px;margin:0;text-transform:capitalize}.toolbar{display:flex;align-items:center;gap:12px;margin:24px 0;flex-wrap:wrap}.toolbar select{width:180px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}.card{background:#131e2a;border:1px solid #2b3a4c;border-radius:12px;overflow:hidden}.card.selected{border:2px solid #76dfb8}.preview{border:0;border-radius:0;background:radial-gradient(#45515d,#202b36);padding:14px;display:block;width:100%;height:255px}.preview img{width:100%;height:100%;object-fit:contain;image-rendering:auto}.info{padding:16px}.info p{font-size:12px;color:#acbccd;line-height:1.5;overflow-wrap:anywhere}.badge{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#8edac5}.pick{width:100%}.selected .pick{background:#285c4b}a{color:#a2d8ff}dialog{background:#101a26;color:inherit;border:1px solid #52647b;border-radius:12px;width:min(1100px,95vw);max-height:94vh}dialog::backdrop{background:#000c}dialog img{width:100%;height:65vh;object-fit:contain}#detail{overflow-wrap:anywhere;line-height:1.6}#models{margin-top:30px;line-height:2}#models a{display:block}@media(max-width:700px){header{padding:16px;flex-wrap:wrap}aside{position:static;width:auto;height:220px}main{margin:0;padding:16px}#list{grid-template-columns:repeat(2,1fr)}#status{margin-left:0}.grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}}
</style>
<header><div><h1>Pokédex / Reference desk</h1><small id="count">Loading library…</small></div><a href="experiments.html?pokemon=charizard">Experiments</a><span id="status" role="status">Connecting…</span><button id="export">Export choices</button></header>
<aside><input id="search" placeholder="Find Pokémon or number" aria-label="Search Pokémon"><div id="list"></div></aside>
<main><div class="top"><h2 id="name"></h2><span id="meta" class="muted"></span></div><p class="muted">Choose the images you want us to use. Selections save to this project. Click an image to inspect it at full size.</p><div class="toolbar"><select id="stage" aria-label="Image category"><option>All images</option><option>Your references</option><option>Instagram</option><option>Reference</option><option>TV show</option><option>Realism reference</option><option>Concept</option><option>Small edits</option><option>Blender</option></select><label><input type="checkbox" id="chosen" style="width:auto"> Selected only</label><span id="summary" class="muted"></span></div><div id="grid" class="grid"></div><div id="models"></div><div id="videos"></div></main>
<dialog id="viewer"><button id="close">Close</button><img id="large" alt=""><div id="detail"></div></dialog>
<script type="module">
const $=id=>document.getElementById(id);let catalog,choices={},current;let saving=Promise.resolve();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const url=p=>'/'+p.split('/').map(encodeURIComponent).join('/');
function list(){const q=$('search').value.toLowerCase().trim();$('list').replaceChildren();for(const s of catalog.species.filter(s=>s.slug.includes(q)||s.name.toLowerCase().includes(q)||String(s.id).padStart(4,'0').includes(q))){const b=document.createElement('button');b.textContent=`${String(s.id).padStart(4,'0')}  ${s.name}${choices[s.slug]?.length?' ★':''}`;b.className=s===current?'active':'';b.onclick=()=>select(s);$('list').append(b)}}
function select(s){current=s;history.replaceState(null,'','?pokemon='+s.slug);$('name').textContent=s.name;$('meta').textContent='#'+String(s.id).padStart(4,'0')+' · '+s.types.join(' / ');list();render()}
function render(){$('videos').innerHTML=(current.videos||[]).map(v=>`<h3>Reference video · ${esc(v.creator)}</h3><video controls preload="metadata" style="max-width:100%;max-height:650px" src="${url(v.path)}"></video><p class="muted">${esc(v.note)} <a href="${esc(v.source)}" target="_blank" rel="noopener">Original post</a></p>`).join('');const selected=choices[current.slug]||[];const imgs=current.images.filter(i=>($('stage').value==='All images'||i.stage===$('stage').value)&&(!$('chosen').checked||selected.includes(i.path)));$('summary').textContent=`${current.images.length} images · ${selected.length} selected`;$('grid').replaceChildren();for(const i of imgs){const yes=selected.includes(i.path),card=document.createElement('article');card.className='card'+(yes?' selected':'');card.innerHTML=`<button class="preview" aria-label="Inspect ${esc(i.label)}"><img loading="lazy" src="${url(i.path)}" alt="${esc(current.name+' — '+i.label)}"></button><div class="info"><span class="badge">${esc(i.stage)}</span><h3>${esc(i.label)}</h3><p>${i.width&&i.height?`${i.width} × ${i.height} · `:''}${Math.round(i.bytes/1024)} KB</p><p>${esc(i.note)}</p><button class="pick" aria-pressed="${yes}">${yes?'✓ Selected — remove':'Choose reference'}</button></div>`;card.querySelector('.preview').onclick=()=>{ $('large').src=url(i.path);$('large').alt=current.name+' '+i.label;$('detail').innerHTML=`<strong>${esc(i.label)}</strong><p>${esc(i.note)}</p><p>Source: ${/^https?:/.test(i.source)?`<a href="${esc(i.source)}" target="_blank" rel="noopener">Original source</a>`:esc(i.source)}</p><p><a href="${url(i.path)}" target="_blank">Open original image</a></p><small>SHA-256: ${esc(i.sha256)}</small>`;$('viewer').showModal()};card.querySelector('.pick').onclick=()=>{const set=new Set(choices[current.slug]||[]),selected=!set.has(i.path);selected?set.add(i.path):set.delete(i.path);choices[current.slug]=[...set];render();list();saveChoice(current.slug,i.path,selected)};$('grid').append(card)}if(!imgs.length)$('grid').textContent='No images in this category yet.';$('models').innerHTML=current.models.length?'<h3>Model files</h3>'+current.models.map(m=>`<a href="${url(m.path)}">${esc(m.label)} · ${(m.bytes/1048576).toFixed(1)} MB</a>`).join(''):''}
function saveChoice(species,path,selected){$('status').textContent='Saving choices…';saving=saving.catch(()=>{}).then(async()=>{const r=await fetch('/api/selections/image',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({species,path,selected})});if(!r.ok)throw Error('Save failed');const result=await r.json();if(!result.saved||!result.selections)throw Error('Save was not confirmed');choices=result.selections;render();list();$('status').textContent='Choices saved to project'}).catch(()=>{$('status').textContent='Save failed — export choices to keep them'})}
$('search').oninput=list;$('stage').onchange=render;$('chosen').onchange=render;$('close').onclick=()=>$('viewer').close();$('export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(choices,null,2)],{type:'application/json'}));a.download='pokemon-reference-choices.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
try{[catalog,choices]=await Promise.all([fetch('catalog.json').then(r=>{if(!r.ok)throw Error();return r.json()}),fetch('/api/selections').then(r=>{if(!r.ok)throw Error();return r.json()})]);$('count').textContent=`${catalog.species.length.toLocaleString()} Pokémon · ${catalog.species.reduce((a,s)=>a+s.images.length,0).toLocaleString()} images`;$('status').textContent='Choices loaded';select(catalog.species.find(s=>s.slug===new URLSearchParams(location.search).get('pokemon'))||catalog.species.find(s=>s.slug==='charizard'))}catch(e){$('status').textContent='Library could not load. Reload to retry.'}
</script></html>
